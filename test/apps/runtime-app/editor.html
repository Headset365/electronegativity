<!doctype html>
<html>
<head><title>Editor</title></head>
<body><div contenteditable="true">Document</div>
<div id="stored"></div>
<script>
  // stand-in for stored content rendered as HTML at runtime: carries an event handler and an attribute named
  // after the planted marker, so the renderer-side observer reports the DOM injection and the marker as live HTML
  setTimeout(function () {
    document.getElementById('stored').innerHTML = '<img src=x onerror="void 0"><span data-ENGCANARY="1">note</span>';
  }, 150);
</script>
</body>
</html>
