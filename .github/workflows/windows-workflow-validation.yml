name: Windows interactive upstream workflows
on:
  push:
    branches: [validation/windows-workflows-20261002]
permissions:
  contents: read
concurrency:
  group: windows-workflows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  applications:
    name: ${{ matrix.app }} interactive Windows workflow
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        app: [trilium, siyuan, notesnook]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false node-pty@1.1.0
      - name: Start the real CLI and Windows workflow driver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force workflow-results/${{ matrix.app }} | Out-Null
          $engArgs = @('--max-old-space-size=6144', 'scripts/validate-windows-workflows.mjs', '${{ matrix.app }}')
          $engProcess = Start-Process -FilePath (Get-Command node).Source -ArgumentList $engArgs -PassThru -RedirectStandardOutput 'workflow-results/${{ matrix.app }}/driver-stdout.log' -RedirectStandardError 'workflow-results/${{ matrix.app }}/driver-stderr.log'
          $engProcess.Id | Set-Content 'workflow-results/${{ matrix.app }}/driver.pid'
      - name: Wait for initial renderer or diagnostic evidence
        shell: pwsh
        run: |
          for ($engTick = 0; $engTick -lt 45; $engTick++) {
            if ((Test-Path 'workflow-results/${{ matrix.app }}/initial-renderer.json') -or (Test-Path 'workflow-results/${{ matrix.app }}/exit-status.json')) { break }
            Start-Sleep -Seconds 4
          }
      - name: Upload intermediate evidence for live review
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ matrix.app }}
          path: workflow-results/${{ matrix.app }}
          retention-days: 1
      - name: Wait for the workflow and verify its exit status
        shell: pwsh
        run: |
          $engDeadline = (Get-Date).AddMinutes(40)
          while (-not (Test-Path 'workflow-results/${{ matrix.app }}/exit-status.json')) {
            if ((Get-Date) -gt $engDeadline) { throw 'Windows workflow driver timed out' }
            Start-Sleep -Seconds 3
          }
          Get-Content 'workflow-results/${{ matrix.app }}/driver-stdout.log'
          Get-Content 'workflow-results/${{ matrix.app }}/driver-stderr.log'
          $engExit = Get-Content 'workflow-results/${{ matrix.app }}/exit-status.json' | ConvertFrom-Json
          exit $engExit.exitCode
      - name: Upload reports and workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflows-${{ matrix.app }}
          path: workflow-results/${{ matrix.app }}
          if-no-files-found: error
          retention-days: 7
