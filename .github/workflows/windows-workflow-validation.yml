name: Windows interactive upstream workflows
on:
  push:
    branches: [validation/windows-workflows-20261002]
permissions:
  contents: read
jobs:
  cleanup:
    name: Stop superseded validation attempts
    runs-on: windows-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            // Only these attempts from this validation task, never other workflows.
            for (const run_id of [37015607140, 37016737108, 37017658872, 37017990349, 37018332152, 37018654612, 37019732127]) {
              try {
                const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
                if (run.head_branch === 'validation/windows-workflows-20261002' && run.status !== 'completed') {
                  await github.rest.actions.cancelWorkflowRun({...context.repo, run_id});
                  core.info(`Stopped superseded validation run ${run_id}`);
                }
              } catch (error) {
                if (error.status !== 409) throw error;
              }
            }
  applications:
    needs: cleanup
    name: ${{ matrix.app }} interactive Windows workflow
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(contains(github.event.head_commit.message, 'only:siyuan') && '["siyuan"]' || contains(github.event.head_commit.message, 'only:trilium') && '["trilium"]' || contains(github.event.head_commit.message, 'only:notesnook') && '["notesnook"]' || '["trilium","siyuan","notesnook"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false node-pty@1.1.0
      - name: Check the latest scanner and Windows terminal regressions
        if: matrix.app == 'trilium'
        run: npm test
      - name: Run the real CLI and interact with the pinned Windows app
        shell: pwsh
        run: node --max-old-space-size=6144 scripts/validate-windows-workflows.mjs ${{ matrix.app }}
      - name: Upload reports and workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflows-${{ matrix.app }}
          path: workflow-results/${{ matrix.app }}
          if-no-files-found: error
          retention-days: 7
