name: CI

on:
  push:
    branches: [master, main, merged-electron-dynamic]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Capture Windows TUI design previews
        if: matrix.node == 24
        run: node scripts/preview-tui-windows.mjs

  watch-mode:
    name: Watch mode end to end (Electron ${{ matrix.electron }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ELECTRONEGATIVITY_REQUIRE_RUNTIME_TESTS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        # 34 ships a Node module loader that crashes under --inspect-brk (see watch/launch.js)
        electron: [34, 38]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save electron@${{ matrix.electron }}
      - run: npx mocha --no-config --timeout 120000 test/test_watch.js test/test_runtime_benchmark.js --forbid-pending
      - name: Windows TUI with real Electron
        env:
          ELECTRONEGATIVITY_REQUIRE_TUI_RUNTIME: '1'
        run: npx mocha --no-config --timeout 240000 test/test_tui_runtime_windows.js --forbid-pending
      - name: Windows native proof and inventory fixtures
        if: runner.os == 'Windows'
        env:
          ELECTRONEGATIVITY_REQUIRE_WINDOWS_PROOFS: '1'
        run: npx mocha --no-config --timeout 120000 test/test_windows_live_proofs.js --forbid-pending

  benchmark:
    name: Pinned vulnerable and patched application benchmark on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:benchmark
